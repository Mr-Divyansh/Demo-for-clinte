<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop All Products | Speed Boost Nutrition</title>
  <meta name="description" content="Browse protein, creatine, mass gainer, pre-workout and wellness supplements at Speed Boost Nutrition. Cash on delivery and all-India shipping." />

  <!-- Shared homepage design system, then shop-only styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/shop.css" />

</head>

<body>

  <a class="skip-link" href="#main">Skip to main content</a>


  <!-- ================= HEADER (same as homepage) ================= -->
  <header>
    <div class="container nav">

      <a class="logo" href="index.html">
        <div class="logo-mark">SB</div>
        SPEED <span>BOOST</span> NUTRITION
      </a>

      <nav class="nav-links" aria-label="Main">
        <a href="index.html">Home</a>
        <a class="active" href="shop.html" aria-current="page">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>

      <div class="nav-actions">
        <button class="icon-btn" type="button" aria-label="Search products" data-focus-search>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
          </svg>
        </button>

        <button class="icon-btn" type="button" aria-label="Cart">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.5 3h2l2.2 11.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21 7H6" />
            <circle cx="9.5" cy="20" r="1.5" /><circle cx="17.5" cy="20" r="1.5" />
          </svg>
          <span class="cart-count" data-cart-count>0</span>
        </button>

        <a class="login-btn" href="#">Login / Sign Up</a>
      </div>

    </div>
  </header>


  <main id="main">

    <!-- ================= PAGE HERO ================= -->
    <section class="shop-hero">
      <div class="container shop-hero__inner">

        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <span class="sep" aria-hidden="true">/</span>
          <span aria-current="page">Shop</span>
        </nav>

        <h1>Shop <span>All Products</span></h1>

        <p>
          Browse the full nutrition range. Filter by category and price to find
          what suits your routine.
        </p>

        <div class="shop-search">
          <svg class="shop-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
          </svg>
          <label class="sr-only" for="shopSearch">Search products</label>
          <input type="search" id="shopSearch" placeholder="Search products…" autocomplete="off" />
        </div>

      </div>
    </section>


    <!-- ================= SHOP BODY ================= -->
    <div class="shop-wrap">
      <div class="container shop-layout">

        <!-- ---------- FILTERS ---------- -->
        <aside class="shop-filters" id="shopFilters" aria-label="Product filters">

          <div class="filter-drawer-head">
            <h2>Filters</h2>
            <button class="filter-drawer-close" type="button" data-close-filters aria-label="Close filters">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" />
              </svg>
            </button>
          </div>

          <form id="filterForm" novalidate>

            <fieldset class="filter-group">
              <legend class="filter-group__title">Category</legend>
              <div class="filter-list" data-filter-group="category"></div>
            </fieldset>

            <fieldset class="filter-group">
              <legend class="filter-group__title">Availability</legend>
              <div class="filter-list" data-filter-group="availability"></div>
            </fieldset>

            <fieldset class="filter-group">
              <legend class="filter-group__title">Price</legend>
              <div class="filter-list" data-filter-group="price"></div>
            </fieldset>

            <button class="filter-reset" type="button" data-reset-filters>Clear all filters</button>
          </form>

        </aside>

        <div class="drawer-backdrop" data-close-filters></div>

        <!-- __BODY2__ -->

      </div>
    </div>

  </main>

</body>
</html>
